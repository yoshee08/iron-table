; IRon Table PHP settings. Loaded after php.ini-production.

expose_php = Off
memory_limit = 256M

; IR plan uploads (spec SEC-09). Keep in step with the application limit.
upload_max_filesize = 20M
post_max_size = 25M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
