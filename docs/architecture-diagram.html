<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deployment Architecture</title>
<meta name="description" content="Docker Compose deployment of the IR tabletop application.">
<style>
:root{color-scheme:light dark;
 --bg:#ffffff;--surface:#f6f7f9;--border:#d9dde3;--text:#1b1f24;--muted:#5b6470;--accent:#2563eb;--code-bg:#f1f3f6;
 --cds-text-primary:#1b1f24;--cds-text-secondary:#5b6470;--cds-chart-axis:#9aa3ae;--cds-chart-grid:#d9dde3;
 --cds-chart-categorical-1:#2563eb;--cds-chart-reference-tint:#eef1f5;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0f1216;--surface:#171b21;--border:#2b323b;--text:#e6e9ed;--muted:#9aa4af;--accent:#60a5fa;--code-bg:#1b2027;
 --cds-text-primary:#e6e9ed;--cds-text-secondary:#9aa4af;--cds-chart-axis:#6b7581;--cds-chart-grid:#2b323b;
 --cds-chart-categorical-1:#60a5fa;--cds-chart-reference-tint:#1b2027;}}
:root[data-theme="dark"]{
 --bg:#0f1216;--surface:#171b21;--border:#2b323b;--text:#e6e9ed;--muted:#9aa4af;--accent:#60a5fa;--code-bg:#1b2027;
 --cds-text-primary:#e6e9ed;--cds-text-secondary:#9aa4af;--cds-chart-axis:#6b7581;--cds-chart-grid:#2b323b;
 --cds-chart-categorical-1:#60a5fa;--cds-chart-reference-tint:#1b2027;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:1.9rem;line-height:1.25;margin:0 0 4px}
h2{font-size:1.35rem;margin:2.4rem 0 .6rem;padding-top:1rem;border-top:1px solid var(--border)}
h3{font-size:1.05rem;margin:1.6rem 0 .4rem}
.meta{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem}
a{color:var(--accent)}
code{background:var(--code-bg);padding:.1em .35em;border-radius:4px;font-size:.88em}
pre{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:14px;overflow-x:auto;font-size:.85rem;line-height:1.5}
pre code{background:none;padding:0}
.table-wrap{overflow-x:auto;margin:1rem 0}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--surface);font-weight:600}
figure{margin:1.5rem 0;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
figure svg{display:block;width:100%;height:auto}
figcaption{color:var(--muted);font-size:.85rem;margin-top:8px;text-align:center}
li input[type=checkbox]{margin-right:.5em}
nav.toc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 18px;margin:1rem 0 2rem;font-size:.92rem}
nav.toc ol{margin:.3rem 0;padding-left:1.2rem}
.theme-toggle{position:fixed;top:12px;right:12px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:.85rem}
@media print{.theme-toggle,nav.toc{display:none}h2{break-before:auto}figure{break-inside:avoid}}
</style>
</head>
<body>
<button class="theme-toggle" type="button" aria-label="Switch light or dark theme">Theme</button>
<script>
(function(){var r=document.documentElement,b=document.querySelector('.theme-toggle');
try{var s=localStorage.getItem('theme');if(s)r.setAttribute('data-theme',s);}catch(e){}
b.addEventListener('click',function(){var d=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
var n=d==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}});})();
</script>
<main>
<h1>Deployment architecture</h1><figure><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 412' role='img' aria-label='One image runs the web app, live updates and background jobs' font-family='inherit'><defs><marker id='arch-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--cds-chart-axis)'/></marker></defs><text x='24' y='30' font-size='15' font-weight='600' fill='var(--cds-text-primary)'>One image runs the web app, live updates and background jobs</text><rect x='210' y='52' width='340' height='56' rx='8' fill='none' stroke='var(--cds-chart-axis)' stroke-width='1.25'/><text x='380' y='76' font-size='13' font-weight='600' text-anchor='middle' fill='var(--cds-text-primary)'>Browsers</text><text x='380' y='96' font-size='11.5' text-anchor='middle' fill='var(--cds-text-secondary)'>Moderator, participants, scribe, shared display</text><rect x='24' y='136' width='712' height='252' rx='8' fill='none' stroke='var(--cds-chart-grid)' stroke-width='1.25'/><text x='720' y='158' font-size='11.5' font-weight='600' text-anchor='end' fill='var(--cds-text-secondary)'>Docker Compose host</text><rect x='40' y='172' width='680' height='108' rx='8' fill='var(--cds-chart-reference-tint)' stroke='var(--cds-chart-grid)' stroke-width='1.25'/><text x='704' y='194' font-size='11.5' font-weight='600' text-anchor='end' fill='var(--cds-text-secondary)'>One project image (Laravel 13), three roles</text><rect x='56' y='208' width='200' height='56' rx='8' fill='var(--cds-chart-categorical-1)' fill-opacity='0.12' stroke='var(--cds-chart-categorical-1)' stroke-width='2'/><text x='156' y='232' font-size='13' font-weight='600' text-anchor='middle' fill='var(--cds-text-primary)'>app</text><text x='156' y='250' font-size='11.5' text-anchor='middle' fill='var(--cds-text-primary)'>FrankenPHP web + Livewire</text><rect x='280' y='208' width='200' height='56' rx='8' fill='var(--cds-chart-categorical-1)' fill-opacity='0.12' stroke='var(--cds-chart-categorical-1)' stroke-width='2'/><text x='380' y='232' font-size='13' font-weight='600' text-anchor='middle' fill='var(--cds-text-primary)'>reverb</text><text x='380' y='250' font-size='11.5' text-anchor='middle' fill='var(--cds-text-primary)'>Live updates (WebSockets)</text><rect x='504' y='208' width='200' height='56' rx='8' fill='var(--cds-chart-categorical-1)' fill-opacity='0.12' stroke='var(--cds-chart-categorical-1)' stroke-width='2'/><text x='604' y='232' font-size='13' font-weight='600' text-anchor='middle' fill='var(--cds-text-primary)'>worker</text><text x='604' y='250' font-size='11.5' text-anchor='middle' fill='var(--cds-text-primary)'>Queue: import, export, AI</text><rect x='40' y='312' width='152' height='56' rx='8' fill='none' stroke='var(--cds-chart-axis)' stroke-width='1.25'/><text x='116' y='336' font-size='13' font-weight='600' text-anchor='middle' fill='var(--cds-text-primary)'>db</text><text x='116' y='354' font-size='11.5' text-anchor='middle' fill='var(--cds-text-secondary)'>PostgreSQL 16</text><rect x='216' y='312' width='152' height='56' rx='8' fill='none' stroke='var(--cds-chart-axis)' stroke-width='1.25'/><text x='292' y='336' font-size='13' font-weight='600' text-anchor='middle' fill='var(--cds-text-primary)'>storage</text><text x='292' y='354' font-size='11.5' text-anchor='middle' fill='var(--cds-text-secondary)'>Encrypted files</text><rect x='392' y='312' width='152' height='56' rx='8' fill='none' stroke='var(--cds-chart-axis)' stroke-width='1.25' stroke-dasharray='5 4'/><text x='468' y='336' font-size='13' font-weight='600' text-anchor='middle' fill='var(--cds-text-primary)'>redis</text><text x='468' y='354' font-size='11.5' text-anchor='middle' fill='var(--cds-text-secondary)'>Optional cache</text><rect x='568' y='312' width='152' height='56' rx='8' fill='none' stroke='var(--cds-chart-axis)' stroke-width='1.25' stroke-dasharray='5 4'/><text x='644' y='336' font-size='13' font-weight='600' text-anchor='middle' fill='var(--cds-text-primary)'>ollama</text><text x='644' y='354' font-size='11.5' text-anchor='middle' fill='var(--cds-text-secondary)'>Optional local AI</text><g fill='none' stroke='var(--cds-chart-axis)' stroke-width='1.25'><path d='M156 108V208' marker-end='url(#arch-arrow)'/><path d='M380 108V208' marker-start='url(#arch-arrow)' marker-end='url(#arch-arrow)'/><path d='M116 264V312' marker-end='url(#arch-arrow)'/><path d='M236 264V312' marker-end='url(#arch-arrow)'/><path d='M520 264V312' marker-end='url(#arch-arrow)' stroke-dasharray='5 4'/><path d='M640 264V312' marker-end='url(#arch-arrow)' stroke-dasharray='5 4'/></g><text x='164' y='126' font-size='11.5' fill='var(--cds-text-secondary)'>HTTPS</text><text x='388' y='126' font-size='11.5' fill='var(--cds-text-secondary)'>WebSocket</text><text x='24' y='404' font-size='11.5' fill='var(--cds-text-secondary)'>Dashed = optional Compose profile. All three roles read and write the db.</text></svg><figcaption>deployment · 3 roles of one image, 2 required and 2 optional data services</figcaption></figure>
</main>
</body>
</html>
