#
# Manual, one-time workflow. It runs scripts/bootstrap-laravel.sh on a GitHub
# runner and pushes the result to the branch "bootstrap/laravel-skeleton".
# Then open a pull request from that branch. CI builds and tests it.
#
# Start it from: GitHub > Actions > Bootstrap Laravel skeleton > Run workflow

name: Bootstrap Laravel skeleton

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Stop if the skeleton already exists
        run: |
          if [ -f artisan ]; then
            echo "::error::The Laravel skeleton already exists on this branch."
            exit 1
          fi

      - name: Run the bootstrap script
        run: scripts/bootstrap-laravel.sh

      - name: Push the result to a new branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c bootstrap/laravel-skeleton
          git add -A
          git commit -m "Add Laravel skeleton (generated by scripts/bootstrap-laravel.sh)"
          git push origin bootstrap/laravel-skeleton
