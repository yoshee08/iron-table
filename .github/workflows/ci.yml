# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Checks every push to main and every pull request.
#   validate  shell scripts, Dockerfile, Compose file
#   security  Composer and npm advisories (spec SEC-13)
#   test      PHP tests (php artisan test) against PostgreSQL 18
#   build     production image: start all services, /up, live-update path,
#             image vulnerability scan (spec SEC-13)
#
# Actions are pinned to full commit SHAs. Dependabot updates them.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check shell scripts
        run: shellcheck docker/entrypoint.sh scripts/*.sh

      - name: Check Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < docker/Dockerfile

      - name: Check Compose file
        run: |
          ./scripts/setup.sh
          docker compose config -q
          docker compose --profile redis --profile ai config -q

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Composer advisories
        run: docker run --rm -v "$PWD:/app" -w /app composer:2.8.12 audit --locked --abandoned=report --no-interaction

      - name: npm advisories (high and critical)
        run: npm audit --package-lock-only --audit-level=high

  test:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testing -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the test image
        run: docker build --target test -t iron-table:test -f docker/Dockerfile .

      - name: Run the PHP tests against PostgreSQL 18
        # These values replace the SQLite defaults in phpunit.xml.
        run: |
          docker run --rm --network host \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DB_CONNECTION=pgsql -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_DATABASE=testing -e DB_USERNAME=testing -e DB_PASSWORD=testing \
            iron-table:test php artisan test

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Make a test .env
        # The same script that users run (README "Start"), so CI tests it too.
        run: ./scripts/setup.sh

      - name: Build and start all services
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Check the health endpoint
        run: |
          curl -fsS http://127.0.0.1:8080/up
          docker compose ps

      - name: Check the live-update path (WebSocket through the app port)
        run: |
          key="$(grep '^REVERB_APP_KEY=' .env | cut -d= -f2)"
          # A working path answers "101 Switching Protocols" and stays open,
          # so curl stops at --max-time. Only the HTTP status is checked.
          code="$(curl -s -o /dev/null -w '%{http_code}' --http1.1 --max-time 5 \
            -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
            -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Key: SXJvblRhYmxlQ0lUZXN0IQ==' \
            "http://127.0.0.1:8080/app/${key}?protocol=7&client=js&version=8.4.0" || true)"
          echo "HTTP status: ${code}"
          test "${code}" = "101"

      - name: Scan the image (fail on fixable critical findings)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            iron-table:local

      - name: Report high findings (does not fail)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 \
            image --scanners vuln --severity HIGH --ignore-unfixed --exit-code 0 --no-progress \
            iron-table:local

      - name: Show logs after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop and remove test data
        if: always()
        run: docker compose down -v
