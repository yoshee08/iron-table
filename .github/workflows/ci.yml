# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Checks every push to main and every pull request.
#   validate  shell scripts, Dockerfile, Compose file
#   security  Composer and npm advisories (spec SEC-13)
#   test      PHP code style (Pint) and PHP tests against PostgreSQL 18
#   build     production image: start all services, then .github/ci/*.sh
#
# Actions are pinned to full commit SHAs. Dependabot updates them.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check shell scripts
        run: shellcheck docker/entrypoint.sh scripts/*.sh .github/ci/*.sh

      - name: Check Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 < docker/Dockerfile
          docker run --rm -i hadolint/hadolint:v2.12.0 < docker/images.Dockerfile

      - name: Check Compose file
        run: |
          ./scripts/setup.sh
          docker compose config -q
          docker compose --profile redis --profile ai --profile images config -q

  windows-setup:
    # scripts/setup.ps1 on real Windows with Windows PowerShell 5.1 (what users have).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run scripts/setup.ps1
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup.ps1

      - name: Check the .env file
        shell: powershell
        run: |
          $env_ = [IO.File]::ReadAllText("$PWD\.env")
          if ($env_.Contains("`r")) { throw '.env has CRLF line endings' }
          foreach ($pattern in '(?m)^APP_KEY=base64:.{44}$', '(?m)^DB_PASSWORD=[0-9a-f]{48}$',
                   '(?m)^REVERB_APP_ID=[1-9][0-9]{5}$', '(?m)^REVERB_APP_KEY=[0-9a-f]{32}$',
                   '(?m)^INITIAL_ADMIN_PASSWORD=[0-9a-f]{24}$') {
              if ($env_ -notmatch $pattern) { throw "Missing or wrong: $pattern" }
          }
          $second = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup.ps1 | Out-String
          if ($second -notmatch 'already exists') { throw "Second run did not stop: $second" }
          Write-Output 'OK'

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Composer advisories
        run: docker run --rm -v "$PWD/src:/app" -w /app composer:2.11.1 audit --locked --abandoned=report --no-interaction

      - name: npm advisories (high and critical, reviewed exceptions allowed)
        run: ./.github/ci/npm-audit.sh

  test:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testing -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Get the week for the security-update layer
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build the test image (cached layers)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: test
          tags: iron-table:test
          load: true
          build-args: SECURITY_UPDATES=${{ steps.week.outputs.week }}
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max

      - name: Check the PHP code style (Laravel Pint)
        run: docker run --rm iron-table:test vendor/bin/pint --test -v

      - name: Run the PHP tests against PostgreSQL 18
        # These values replace the SQLite defaults in src/phpunit.xml.
        run: |
          docker run --rm --network host \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DB_CONNECTION=pgsql -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_DATABASE=testing -e DB_USERNAME=testing -e DB_PASSWORD=testing \
            iron-table:test php artisan test

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make a test .env
        # The same script that users run (README "Start"), so CI tests it too.
        run: ./scripts/setup.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Get the week for the security-update layer
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build the production image (cached layers)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          tags: iron-table:local
          load: true
          build-args: SECURITY_UPDATES=${{ steps.week.outputs.week }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: Start all services
        run: docker compose up -d --wait --wait-timeout 300

      - name: Check the running stack (health, live updates, first administrator)
        run: ./.github/ci/check-stack.sh

      - name: Backup and restore round trip
        run: ./.github/ci/backup-roundtrip.sh

      - name: Scan the image (report HIGH, fail on fixable CRITICAL)
        run: ./.github/ci/scan-image.sh iron-table:local

      - name: Show logs after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop and remove test data
        if: always()
        run: docker compose down -v
