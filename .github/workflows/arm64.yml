# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Builds the production image for linux/arm64 (spec 11.3, item 3) with QEMU
# emulation, then checks PHP and the extensions in that image.
# Emulation is slow, so this runs only when docker/ changes in a pull request,
# weekly (this also refreshes the cache for main), and by hand. Cached layers
# make repeat builds fast.

name: arm64 build

on:
  pull_request:
    paths:
      - docker/**
      - .github/workflows/arm64.yml
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Get the week for the security-update layer
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build the runtime image for linux/arm64 (cached layers)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/arm64
          tags: iron-table:arm64
          load: true
          build-args: SECURITY_UPDATES=${{ steps.week.outputs.week }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Check the arm64 image
        run: |
          arch="$(docker image inspect iron-table:arm64 --format '{{.Architecture}}')"
          echo "image architecture: ${arch}"
          test "${arch}" = "arm64"
          docker run --rm --platform linux/arm64 --entrypoint php iron-table:arm64 \
            -r 'echo php_uname("m"), " PHP ", PHP_VERSION, PHP_EOL;'
          found="$(docker run --rm --platform linux/arm64 --entrypoint php iron-table:arm64 -m \
            | grep -cxE 'pdo_pgsql|intl|redis|pcntl|bcmath|zip')"
          echo "required extensions found: ${found} of 6"
          test "${found}" = "6"
