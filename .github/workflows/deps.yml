#
# Manual workflow: runs one Composer or npm command on src/ and pushes the
# changed composer/npm files to a new branch. Then open a pull request.
# This repository has no local PHP or Node.js; this is how dependencies change.
#
# Start it from: GitHub > Actions > Update dependencies > Run workflow
#   (or: gh workflow run deps.yml -f tool=composer -f args="require vendor/package:^1" -f branch=deps/package)

name: Update dependencies

on:
  workflow_dispatch:
    inputs:
      tool:
        description: Tool
        required: true
        type: choice
        options: [composer, npm]
      args:
        description: "Arguments, for example: require laravel/fortify:^1.42"
        required: true
        type: string
      branch:
        description: New branch for the result
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run the tool
        env:
          TOOL: ${{ inputs.tool }}
          ARGS: ${{ inputs.args }}
        run: ./.github/ci/update-deps.sh

      - name: Push the result to a new branch
        env:
          TOOL: ${{ inputs.tool }}
          ARGS: ${{ inputs.args }}
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add src/composer.json src/composer.lock src/package.json src/package-lock.json
          git commit -m "Update dependencies: $TOOL $ARGS"
          git push origin "$BRANCH"
