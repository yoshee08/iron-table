#
# IRon Table - Docker Compose deployment (spec section 11).
#
#   docker compose up -d                     required services
#   docker compose --profile redis up -d     + Redis cache and queue
#   docker compose --profile ai up -d        + local AI model (Ollama)
#
# All settings come from .env. Copy .env.example to .env first.

name: iron-table

x-app-image: &app-image
  image: ${IRON_TABLE_IMAGE:-iron-table:local}
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: runtime
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/app/storage
  security_opt:
    - no-new-privileges:true

services:
  app:
    <<: *app-image
    command: ["app"]
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  reverb:
    <<: *app-image
    command: ["reverb"]
    environment:
      REVERB_SERVER_PORT: "8080"
    # No public port. Browsers reach Reverb through the app port: docker/Caddyfile
    # forwards /app/* to this service.
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app-image
    command: ["worker"]
    # The queue worker has no port. This liveness check confirms that the queue
    # process (PID 1, started with exec) is alive. "docker compose up --wait"
    # needs a health check on every service.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-iron_table}
      POSTGRES_USER: ${DB_USERNAME:-iron_table}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ keeps data under /var/lib/postgresql/18/docker and
      # refuses to start with a volume at the old path /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:0.40.15
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  storage:
  ollama:
