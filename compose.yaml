# SPDX-License-Identifier: AGPL-3.0-or-later
#
# IRon Table - Docker Compose deployment (spec section 11).
#
#   docker compose up -d                     required services
#   docker compose --profile redis up -d     + Redis cache and queue
#   docker compose --profile ai up -d        + local AI model (Ollama)
#   docker compose --profile images up -d    + local AI pictures (FLUX.2 klein, about 5 GB download)
#
# All settings come from .env. Run ./scripts/setup.sh first.

name: iron-table

x-app-image: &app-image
  image: ${IRON_TABLE_IMAGE:-iron-table:local}
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: runtime
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/app/storage
  security_opt:
    - no-new-privileges:true

services:
  app:
    <<: *app-image
    command: ["app"]
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  reverb:
    <<: *app-image
    command: ["reverb"]
    environment:
      REVERB_SERVER_PORT: "8080"
    # No public port: docker/Caddyfile forwards /app/* from the app port.
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app-image
    command: ["worker"]
    # No port: check that the queue process (PID 1) is alive.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-iron_table}
      POSTGRES_USER: ${DB_USERNAME:-iron_table}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ refuses the old mount path /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.10-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:0.40.17
    profiles: ["ai"]
    restart: unless-stopped
    # Keep the local model small (spec section 9.1).
    mem_limit: ${AI_MEMORY_LIMIT:-2g}
    volumes:
      - ollama:/root/.ollama
    security_opt:
      - no-new-privileges:true

  # Local AI pictures: stable-diffusion.cpp sd-server with FLUX.2 klein 4B on the CPU.
  # The project publishes GPU images only, so docker/images.Dockerfile builds the CPU
  # server from a pinned commit on the first start (about 20 minutes). A picture takes minutes.
  images:
    profiles: ["images"]
    image: iron-table-images:79dc7ca
    build:
      context: .
      dockerfile: docker/images.Dockerfile
      args:
        BUILD_JOBS: ${AI_IMAGE_BUILD_JOBS:-2}
    command:
      - --listen-ip
      - 0.0.0.0
      - --listen-port
      - "1234"
      - --model-dir
      - /models
      - --diffusion-model
      - /models/flux-2-klein-4b-Q4_0.gguf
      - --llm
      - /models/Qwen3-4B-Q4_K_M.gguf
      - --vae
      - /models/full_encoder_small_decoder.safetensors
      - --cfg-scale
      - "1.0"
    volumes:
      - imagemodels:/models:ro
    depends_on:
      images-models:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: ${AI_IMAGE_MEMORY_LIMIT:-10g}
    # CPU cores for pictures. 0 = all cores. Set fewer to keep the app fast on a small server.
    cpus: ${AI_IMAGE_CPUS:-0}
    security_opt:
      - no-new-privileges:true

  # Downloads the image model files one time (Apache-2.0, about 5.2 GB), from pinned
  # Hugging Face revisions, and checks the SHA-256 of each file.
  images-models:
    profiles: ["images"]
    image: curlimages/curl:8.22.0
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cd /models
        get() {
          [ -s "$$1" ] && return 0
          echo "Downloading $$1"
          curl -fL --retry 3 -o "$$1.part" "$$3"
          echo "$$2  $$1.part" | sha256sum -c -
          mv "$$1.part" "$$1"
        }
        get flux-2-klein-4b-Q4_0.gguf d1023499ef3f2f82ff7c50e6778495195c1b6cc34835741778868428111f9ff4 https://huggingface.co/leejet/FLUX.2-klein-4B-GGUF/resolve/3b1f5a9dc3abb32238b053aeb3d823c30afdacbd/flux-2-klein-4b-Q4_0.gguf
        get Qwen3-4B-Q4_K_M.gguf f6f851777709861056efcdad3af01da38b31223a3ba26e61a4f8bf3a2195813a https://huggingface.co/unsloth/Qwen3-4B-GGUF/resolve/22c9fc8a8c7700b76a1789366280a6a5a1ad1120/Qwen3-4B-Q4_K_M.gguf
        get full_encoder_small_decoder.safetensors ea4273f02d1fafbf8e1d1c2cf6018ed8748652eb0bf34f2dd91171f16f15ab62 https://huggingface.co/black-forest-labs/FLUX.2-small-decoder/resolve/a3efc24f613ef42d9428af62fdbd6f5fd8856c4a/full_encoder_small_decoder.safetensors
    volumes:
      - imagemodels:/models
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  storage:
  ollama:
  imagemodels:
